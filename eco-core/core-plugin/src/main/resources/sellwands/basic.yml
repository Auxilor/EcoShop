name: "&6Sell Wand"
item: blaze_rod glint name:"&6Sell Wand"
lore:
  - "&7Right-click a container to sell its contents."
  - "&7Left-click to preview."
  - "&7Uses left: &e%uses%"
  - "&7Multiplier: &a%multiplier%x"
  - "&7Sold: &a%sold_items%&7 items for &a%sold_value%"

uses: 100
cooldown: 5
period-limit:
  uses: -1
  period: 1440
max-items-per-use: -1
max-value-per-use: -1
multiplier: 1.0
require-sneak: false
break-when-empty: true

containers:
  - chest
  - trapped_chest
  - barrel
  - shulker_box

filters:
  shops: [ ]
  whitelist: [ ]
  blacklist: [ ]
  multipliers: [ ]

bypass:
  dynamic-pricing: false
  player-limits: false
  global-limits: false

conditions: [ ]

inspect:
  enabled: true
  display: message # message, hologram or both.
  duration: 60 # Ticks the hologram stays.
  height: 1.5 # Blocks above the container.
  lines:
    - "&fSells &a%amount%&f items"
    - "&ffor &a%price%"
    - "&7%unsold% stacks can't be sold"
